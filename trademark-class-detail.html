<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商标分类详情 - 科邦知识产权</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header { background: #0a2c5c; color: white; padding: 20px; border-radius: 0 0 20px 20px; margin-bottom: 25px; position: sticky; top: 0; z-index: 100; }
        .header a { color: #facc15; text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 8px; }
        .header h1 { font-size: 1.4rem; }
        .header .badge { display: inline-block; background: #facc15; color: #0a2c5c; padding: 4px 14px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; margin-top: 8px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 3px 12px rgba(0,0,0,0.04); }
        .search-box input { flex: 1; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 30px; font-size: 1rem; outline: none; }
        .search-box input:focus { border-color: #2563eb; }
        .search-box button { padding: 12px 25px; background: #2563eb; color: white; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .search-hint { font-size: 0.8rem; color: #64748b; text-align: center; margin-bottom: 15px; }
        .stats { color: #64748b; font-size: 0.9rem; margin-bottom: 10px; text-align: center; }
        .stats span { color: #2563eb; font-weight: 700; }
        .subclass-section { background: white; border-radius: 15px; margin-bottom: 15px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .subclass-header { background: #f0f4ff; padding: 15px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #2563eb; transition: 0.2s; }
        .subclass-header:hover { background: #dbeafe; }
        .subclass-header h3 { color: #0a2c5c; font-size: 1rem; display: flex; align-items: center; gap: 8px; flex: 1; }
        .subclass-header .toggle-icon { color: #2563eb; transition: 0.3s; }
        .subclass-header.open .toggle-icon { transform: rotate(180deg); }
        .subclass-items { display: none; padding: 15px 20px; border-top: 1px solid #e2e8f0; }
        .subclass-items.show { display: block; }
        .item-tag { display: inline-block; background: #f8fafc; padding: 6px 12px; border-radius: 8px; margin: 3px; font-size: 0.85rem; border: 1px solid #e2e8f0; transition: 0.2s; }
        .item-tag:hover { background: #dbeafe; border-color: #2563eb; }
        .item-tag .code { color: #94a3b8; font-size: 0.7rem; margin-right: 4px; }
        .item-tag.hidden { display: none; }
        .no-result { text-align: center; padding: 50px; color: #94a3b8; display: none; }
        .note-box { background: #fef3c7; border-radius: 10px; padding: 15px; margin-top: 20px; font-size: 0.9rem; color: #92400e; }
        .loading { text-align: center; padding: 30px; color: #64748b; }
        .loading i { font-size: 2rem; color: #2563eb; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.1rem; }
            .subclass-header h3 { font-size: 0.9rem; }
            .item-tag { font-size: 0.78rem; padding: 5px 8px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="trademark-classes.html"><i class="fas fa-arrow-left"></i> 返回类别列表</a>
        <h1 id="pageTitle">加载中...</h1>
        <span class="badge" id="classType">-</span>
    </div>
    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索具体商品/服务名称或编号..." oninput="searchItems()">
            <button onclick="searchItems()"><i class="fas fa-search"></i> 搜索</button>
        </div>
        <div class="search-hint">💡 支持搜索商品名称、编号，如"手机"、"090001"、"口红"、"服装"</div>
        <div class="stats">共 <span id="totalSub">0</span> 个子类 | <span id="totalItems">0</span> 个商品/服务 | 显示 <span id="showItems">0</span> 个</div>
        <div id="contentArea"><div class="loading"><i class="fas fa-spinner"></i><p>加载中...</p></div></div>
        <div class="no-result" id="noResult"><i class="fas fa-search"></i><p>未找到匹配的项目</p></div>
        <div class="note-box"><strong>📌 说明：</strong>本表基于尼斯分类。如需专业商标注册服务，请联系<strong>科邦知识产权</strong>：0755-8866 8828</div>
    </div>
    <script src="tm-data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const classNum = parseInt(urlParams.get('class')) || 1;
        const className = window.cnMap[classNum] || "未知类别";
        const classType = classNum <= 34 ? 'goods' : 'service';
        document.getElementById('pageTitle').textContent = `第${classNum}类 - ${className}`;
        document.getElementById('classType').textContent = classType === 'goods' ? '商品类（第1-34类）' : '服务类（第35-45类）';
        let subClasses = window.classData[classNum] || [];
        if(subClasses.length === 0) subClasses = [{name: className + " 详细数据", items: [["", "数据整理中，请参考官方分类表"]]}];
        let totalSub = subClasses.length;
        let totalItems = 0;
        subClasses.forEach(s => totalItems += s.items.length);
        document.getElementById('totalSub').textContent = totalSub;
        document.getElementById('totalItems').textContent = totalItems;
        document.getElementById('showItems').textContent = totalItems;
        function renderAll(data) {
            const area = document.getElementById('contentArea');
            area.innerHTML = data.map((sub, idx) => `
                <div class="subclass-section">
                    <div class="subclass-header" onclick="toggleSubclass(this)">
                        <h3><i class="fas fa-folder"></i> ${sub.name} <span style="color:#94a3b8;font-size:0.8rem;">(${sub.items.length}项)</span></h3>
                        <i class="fas fa-chevron-down toggle-icon"></i>
                    </div>
                    <div class="subclass-items" id="subItems${idx}">
                        ${sub.items.map(item => `<span class="item-tag" data-keywords="${item[1]} ${item[0]}"><span class="code">${item[0]}</span>${item[1]}</span>`).join('')}
                    </div>
                </div>`).join('');
        }
        function toggleSubclass(header) {
            header.classList.toggle('open');
            header.nextElementSibling.classList.toggle('show');
        }
        function searchItems() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            let totalShown = 0;
            document.querySelectorAll('.subclass-section').forEach(section => {
                const items = section.querySelectorAll('.item-tag');
                let sectionShown = 0;
                items.forEach(item => {
                    const kw = item.getAttribute('data-keywords').toLowerCase();
                    if (!keyword || kw.includes(keyword)) { item.classList.remove('hidden'); sectionShown++; totalShown++; }
                    else { item.classList.add('hidden'); }
                });
                const itemsDiv = section.querySelector('.subclass-items');
                const header = section.querySelector('.subclass-header');
                if (keyword && sectionShown > 0) { itemsDiv.classList.add('show'); header.classList.add('open'); }
                if (!keyword) { itemsDiv.classList.remove('show'); header.classList.remove('open'); }
            });
            document.getElementById('showItems').textContent = totalShown;
            document.getElementById('noResult').style.display = (totalShown === 0 && keyword) ? 'block' : 'none';
        }
        renderAll(subClasses);
        setTimeout(() => {
            const firstHeader = document.querySelector('.subclass-header');
            if (firstHeader) { firstHeader.classList.add('open'); firstHeader.nextElementSibling.classList.add('show'); }
        }, 100);
    </script>
</body>
</html>
