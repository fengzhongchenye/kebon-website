// ========== 主逻辑 ==========
var urlParams=new URLSearchParams(window.location.search);
var classNum=parseInt(urlParams.get('class'))||1;
var className=cnMap[classNum]||"未知类别";
var classType=classNum<=34?'goods':'service';
document.getElementById('pageTitle').textContent='第'+classNum+'类 - '+className;
document.getElementById('classType').textContent=classType==='goods'?'商品类（第1-34类）':'服务类（第35-45类）';

var subClasses=classData[classNum]||[];
var totalSub=subClasses.length;
var totalItems=0;
subClasses.forEach(function(s){totalItems+=s.items.length;});
document.getElementById('totalSub').textContent=totalSub;
document.getElementById('totalItems').textContent=totalItems;
document.getElementById('showItems').textContent=totalItems;

function renderAll(data){
    var area=document.getElementById('contentArea');
    var html='';
    data.forEach(function(sub,idx){
        html+='<div class="subclass-section"><div class="subclass-header" onclick="toggleSubclass(this)"><h3><i class="fas fa-folder"></i> '+sub.name+' <span style="color:#94a3b8;font-size:.8rem;">('+sub.items.length+'项)</span></h3><i class="fas fa-chevron-down toggle-icon"></i></div><div class="subclass-items" id="subItems'+idx+'">';
        sub.items.forEach(function(item){
            html+='<span class="item-tag" data-keywords="'+item[1]+' '+item[0]+'"><span class="code">'+item[0]+'</span>'+item[1]+'</span>';
        });
        html+='</div></div>';
    });
    area.innerHTML=html;
}

function toggleSubclass(header){
    header.classList.toggle('open');
    header.nextElementSibling.classList.toggle('show');
}

function searchItems(){
    var keyword=document.getElementById('searchInput').value.trim().toLowerCase();
    var totalShown=0;
    document.querySelectorAll('.subclass-section').forEach(function(section){
        var items=section.querySelectorAll('.item-tag');
        var sectionShown=0;
        items.forEach(function(item){
            var kw=item.getAttribute('data-keywords').toLowerCase();
            if(!keyword||kw.indexOf(keyword)>-1){item.classList.remove('hidden');sectionShown++;totalShown++;}
            else{item.classList.add('hidden');}
        });
        var itemsDiv=section.querySelector('.subclass-items');
        var header=section.querySelector('.subclass-header');
        if(keyword&&sectionShown>0){itemsDiv.classList.add('show');header.classList.add('open');}
        if(!keyword){itemsDiv.classList.remove('show');header.classList.remove('open');}
    });
    document.getElementById('showItems').textContent=totalShown;
    document.getElementById('noResult').style.display=(totalShown===0&&keyword)?'block':'none';
}

renderAll(subClasses);
setTimeout(function(){
    var firstHeader=document.querySelector('.subclass-header');
    if(firstHeader){firstHeader.classList.add('open');firstHeader.nextElementSibling.classList.add('show');}
},100);
</script>
