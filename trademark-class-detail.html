        function renderItems(data) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = data.map(item => `
                <div class="item-tag">
                    <span class="item-code">${item.split(' ')[0]}</span>
                    ${item.split(' ').slice(1).join(' ')}
                </div>
            `).join('');
            document.getElementById('totalItems').textContent = data.length;
            document.getElementById('showItems').textContent = data.length;
        }

        function filterItems() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const allItems = document.querySelectorAll('.item-tag');
            let count = 0;

            allItems.forEach(item => {
                if (!keyword || item.textContent.toLowerCase().includes(keyword)) {
                    item.classList.remove('hidden');
                    count++;
                } else {
                    item.classList.add('hidden');
                }
            });

            document.getElementById('showItems').textContent = count;
            document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
