<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>商标类别表 - 科邦知识产权</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .header { background: #0a2c5c; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; margin-bottom: 25px; }
        .header h1 { font-size: 1.6rem; }
        .header a { color: #facc15; text-decoration: none; font-size: 0.9rem; }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .search-box input { flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 30px; font-size: 1rem; outline: none; }
        .search-box input:focus { border-color: #2563eb; }
        .search-box button { padding: 12px 25px; background: #2563eb; color: white; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .search-results { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.04); margin-bottom: 20px; display: none; max-height: 500px; overflow-y: auto; }
        .search-results h3 { color: #0a2c5c; margin-bottom: 10px; }
        .result-item { padding: 8px 14px; border-radius: 8px; margin-bottom: 4px; background: #f8fafc; border-left: 3px solid #2563eb; cursor: pointer; transition: 0.15s; font-size: 0.9rem; }
        .result-item:hover { background: #dbeafe; }
        .result-code { color: #94a3b8; font-size: 0.75rem; margin-right: 8px; font-weight: 600; display: inline-block; min-width: 55px; }
        .result-class { float: right; color: #2563eb; font-size: 0.75rem; font-weight: 600; }
        .stats { text-align: center; margin-bottom: 15px; color: #64748b; font-size: 0.9rem; }
        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .class-card { background: white; border-radius: 15px; padding: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.04); border-left: 4px solid #2563eb; cursor: pointer; transition: 0.2s; text-decoration: none; color: inherit; display: block; }
        .class-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .class-card .class-num { font-size: 1.3rem; font-weight: 800; color: #2563eb; margin-bottom: 5px; }
        .class-card .class-name { font-weight: 600; color: #0a2c5c; font-size: 1rem; }
        .class-type { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; margin-bottom: 8px; }
        .type-goods { background: #dbeafe; color: #1e40af; }
        .type-service { background: #fef3c7; color: #92400e; }
        @media (max-width: 600px) { .class-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

            <div id="resultList"></div>

        function renderGrid() {
            var html = '';
            for(var i=1;i<=45;i++){
                html += '<a href="trademark-class-detail.html?class='+i+'" class="class-card">';
                html += '<span class="class-type '+(classTypes[i]==='goods'?'type-goods':'type-service')+'">'+(classTypes[i]==='goods'?'商品':'服务')+'</span>';
                html += '<div class="class-num">第'+i+'类</div>';
                html += '<div class="class-name">'+classNames[i]+'</div>';
                html += '</a>';
            }
            document.getElementById('classGrid').innerHTML = html;
        }

        function searchAll() {
            var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            var resultsDiv = document.getElementById('searchResults');
            var resultList = document.getElementById('resultList');
            var grid = document.getElementById('classGrid');
            
            if(!keyword) {
                resultsDiv.style.display = 'none';
                grid.style.display = 'grid';
                return;
            }
            
            var results = [];
            // 搜索最小商品项
            for(var c in itemData) {
                itemData[c].forEach(function(item){
                    if(item[1].toLowerCase().indexOf(keyword) > -1 || item[0].indexOf(keyword) > -1) {
                        results.push({classNum:parseInt(c), code:item[0], name:item[1]});
                    }
                });
            }
            // 也搜索类别名
            for(var cn=1;cn<=45;cn++){
                if(classNames[cn] && classNames[cn].indexOf(keyword) > -1) {
                    results.push({classNum:cn, code:'', name:classNames[cn]+'（类名）'});
                }
            }
            
            if(results.length > 0) {
                // 去重
                var uniqueResults = [];
                var seen = {};
                results.forEach(function(r){
                    var key = r.classNum + '-' + r.code + '-' + r.name;
                    if(!seen[key]) { seen[key] = true; uniqueResults.push(r); }
                });
                
                resultsDiv.style.display = 'block';
                resultList.innerHTML = uniqueResults.slice(0,100).map(function(r){
                    return '<div class="result-item" onclick="location.href=\'trademark-class-detail.html?class='+r.classNum+'\'">' +
                           '<span class="result-class">第'+r.classNum+'类</span>' +
                           (r.code ? '<span class="result-code">'+r.code+'</span>' : '') +
                           '<span class="result-name">'+r.name+'</span>' +
                           '</div>';
                }).join('');
                document.getElementById('resultCount').textContent = '('+uniqueResults.length+'个匹配)';
                grid.style.display = 'none';
            } else {
                resultsDiv.style.display = 'none';
                grid.style.display = 'grid';
            }
        }

        renderGrid();
    </script>
</body>
</html>
