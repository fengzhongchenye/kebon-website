<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商标类别表 - 科邦知识产权</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        .header { background: #0a2c5c; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; margin-bottom: 25px; }
        .header h1 { font-size: 1.6rem; }
        .header a { color: #facc15; text-decoration: none; font-size: 0.9rem; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .search-box input { flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 30px; font-size: 1rem; outline: none; }
        .search-box input:focus { border-color: #2563eb; }
        .search-box button { padding: 12px 25px; background: #2563eb; color: white; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        
        .search-results { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.04); margin-bottom: 20px; display: none; }
        .search-results h3 { color: #0a2c5c; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .search-results .result-item { padding: 10px 14px; border-radius: 10px; margin-bottom: 5px; background: #f8fafc; border-left: 3px solid #2563eb; cursor: pointer; transition: 0.2s; }
        .search-results .result-item:hover { background: #dbeafe; }
        .result-item .result-code { color: #94a3b8; font-size: 0.8rem; margin-right: 8px; font-weight: 600; }
        .result-item .result-name { font-weight: 500; }
        .result-item .result-class { float: right; color: #2563eb; font-size: 0.8rem; font-weight: 600; }
        
        .stats { text-align: center; margin-bottom: 15px; color: #64748b; font-size: 0.9rem; }
        .stats span { color: #2563eb; font-weight: 700; }
        
        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .class-card { background: white; border-radius: 15px; padding: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.04); border-left: 4px solid #2563eb; cursor: pointer; transition: 0.2s; text-decoration: none; color: inherit; display: block; }
        .class-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-left-color: #facc15; }
        .class-card.hidden { display: none; }
        .class-card .class-num { font-size: 1.4rem; font-weight: 800; color: #2563eb; margin-bottom: 5px; }
        .class-card .class-name { font-weight: 600; color: #0a2c5c; margin-bottom: 8px; font-size: 1.05rem; }
        .class-card .class-examples { color: #64748b; font-size: 0.9rem; line-height: 1.5; }
        .class-card .class-type { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; margin-bottom: 8px; }
        .type-goods { background: #dbeafe; color: #1e40af; }
        .type-service { background: #fef3c7; color: #92400e; }
        
        .no-result { text-align: center; padding: 50px; color: #94a3b8; display: none; }
        
        @media (max-width: 600px) {
            .class-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-sitemap"></i> 商标注册用商品和服务分类表</h1>
        <p style="margin-top:8px;opacity:0.9;">基于尼斯分类 | 支持全类目深度搜索</p>
        <a href="index.html">← 返回首页</a>
    </div>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索商品/服务名称或编号（如：手机、口红、090001、餐厅...）" oninput="searchAll()">
            <button onclick="searchAll()"><i class="fas fa-search"></i> 搜索</button>
        </div>
        
        <!-- 搜索结果 -->
        <div class="search-results" id="searchResults">
            <h3><i class="fas fa-list"></i> 搜索结果 <span id="resultCount" style="font-size:0.8rem;color:#64748b;"></span></h3>
            <div id="resultList"></div>
        </div>
        
        <div class="stats">共 <span id="totalCount">45</span> 个类别 | 点击类别查看详细小项</div>
        
        <div class="class-grid" id="classGrid"></div>
        <div class="no-result" id="noResult">
            <i class="fas fa-search"></i>
            <p>未找到匹配的类别，请尝试其他关键词</p>
        </div>
    </div>

    <script>
        // 类别基础信息
        const classNames = {1:"化学原料",2:"颜料油漆",3:"日化用品",4:"燃料油脂",5:"医药用品",6:"金属材料",7:"机械设备",8:"手工器械",9:"科学仪器",10:"医疗器械",11:"灯饰空调",12:"运输工具",13:"军火烟火",14:"珠宝钟表",15:"乐器",16:"办公用品",17:"橡胶制品",18:"皮革皮具",19:"建筑材料",20:"家具家居",21:"厨房洁具",22:"绳网袋蓬",23:"纺织用纱",24:"床上用品",25:"服装鞋帽",26:"花边配饰",27:"地毯地垫",28:"玩具体育",29:"肉类食品",30:"面食调味",31:"农林生鲜",32:"啤酒饮料",33:"含酒精酒类",34:"烟草烟具",35:"广告销售",36:"金融物管",37:"建筑修理",38:"通讯服务",39:"运输旅行",40:"材料加工",41:"教育娱乐",42:"科技服务",43:"餐饮住宿",44:"医疗园艺",45:"社会服务"};
        const classTypes = {};
        for(let i=1;i<=34;i++) classTypes[i]='goods';
        for(let i=35;i<=45;i++) classTypes[i]='service';

        // 从详情页获取完整数据（通过script标签加载）
        // 注意：详情页使用 window.classData 存储数据，这里我们共享同一份数据
        // 由于详情页的数据在独立文件中，这里我们直接加载它
        
        // 加载详情页数据
        const script = document.createElement('script');
        script.src = 'trademark-class-detail.html';
        script.onload = function() {
            // 数据已加载到 window.classData 中
            if (window.classData) {
                renderClassGrid();
            }
        };
        // 由于HTML文件不能直接作为script加载，我们用fetch方式
        
        fetch('trademark-class-detail.html')
            .then(r => r.text())
            .then(html => {
                // 提取classData
                const match = html.match(/var classData=\{[\s\S]*?\};/);
                if (match) {
                    eval(match[0].replace('var classData','window.classData'));
                    renderClassGrid();
                }
            })
            .catch(() => {
                // 如果fetch失败，使用简化数据
                renderClassGrid();
            });
        
        function renderClassGrid() {
            const grid = document.getElementById('classGrid');
            let html = '';
            for(let i=1;i<=45;i++){
                const examples = window.classData && window.classData[i] ? 
                    window.classData[i].slice(0,2).map(s=>s.name.replace(/^\d+\s+/,'')).join('、') : '';
                html += `<a href="trademark-class-detail.html?class=${i}" class="class-card" data-num="${i}">
                    <span class="class-type ${classTypes[i]==='goods'?'type-goods':'type-service'}">${classTypes[i]==='goods'?'商品':'服务'}</span>
                    <div class="class-num">第${i}类</div>
                    <div class="class-name">${classNames[i]}</div>
                    <div class="class-examples">${examples || '点击查看详情'}</div>
                </a>`;
            }
            grid.innerHTML = html;
            document.getElementById('totalCount').textContent = 45;
        }
        
        function searchAll() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('searchResults');
            const resultList = document.getElementById('resultList');
            const classGrid = document.getElementById('classGrid');
            const noResult = document.getElementById('noResult');
            
            if (!keyword) {
                resultsDiv.style.display = 'none';
                classGrid.style.display = 'grid';
                noResult.style.display = 'none';
                document.querySelectorAll('.class-card').forEach(c => c.classList.remove('hidden'));
                return;
            }
            
            // 如果有完整数据，搜索最小项
            if (window.classData) {
                let results = [];
                for(let c=1;c<=45;c++){
                    if(!window.classData[c]) continue;
                    window.classData[c].forEach(sub => {
                        sub.items.forEach(item => {
                            const name = item[1] || '';
                            const code = item[0] || '';
                            if(name.toLowerCase().includes(keyword) || code.includes(keyword)) {
                                results.push({classNum:c, className:classNames[c], code:code, name:name});
                            }
                        });
                    });
                }
                
                if(results.length > 0) {
                    resultsDiv.style.display = 'block';
                    resultList.innerHTML = results.slice(0,50).map(r => `
                        <div class="result-item" onclick="location.href='trademark-class-detail.html?class=${r.classNum}'">
                            <span class="result-code">${r.code}</span>
                            <span class="result-name">${r.name}</span>
                            <span class="result-class">第${r.classNum}类</span>
                        </div>
                    `).join('');
                    document.getElementById('resultCount').textContent = `(${results.length}个匹配)`;
                    classGrid.style.display = 'none';
                    noResult.style.display = 'none';
                } else {
                    resultsDiv.style.display = 'none';
                    classGrid.style.display = 'grid';
                    noResult.style.display = 'block';
                }
            } else {
                // 数据未加载完成，只搜索类别名称
                classGrid.style.display = 'grid';
                resultsDiv.style.display = 'none';
                document.querySelectorAll('.class-card').forEach(card => {
                    const name = classNames[card.getAttribute('data-num')].toLowerCase();
                    if(name.includes(keyword)) { card.classList.remove('hidden'); }
                    else { card.classList.add('hidden'); }
                });
            }
        }
        
        // 初始渲染
        renderClassGrid();
    </script>
</body>
</html>
